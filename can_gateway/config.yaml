name: CAN Gateway
version: "0.3.13"
slug: can_gateway
description: CAN bus gateway (SLCAN / gs_usb), web panel and REST API for Home Assistant.
url: https://github.com/arturkmat/ha-can-gateway
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:lan-connect
panel_title: CAN Gateway
homeassistant: "2024.1.0"
hassio_api: true
hassio_role: default
uart: true
usb: true
devices:
  - /dev/ttyUSB0
  - /dev/ttyACM0
  - /dev/ttyACM1
options:
  can_interface: slcan
  can_port: /dev/ttyACM0
  gsusb_channel: 0
  can_bitrate: 250000
  tty_baudrate: 115200
  master_key_hex: ""
  auto_scan: true
  auto_scan_interval_s: 10
  mqtt_enabled: false
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_topic_prefix: can_gateway
  mqtt_interval_s: 5
schema:
  can_interface: list(slcan|gs_usb)
  can_port: str
  gsusb_channel: int(0,15)
  can_bitrate: list(125000|250000|500000)
  tty_baudrate: list(115200|460800)
  master_key_hex: str
  auto_scan: bool
  auto_scan_interval_s: int(5,120)
  mqtt_enabled: bool
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  mqtt_topic_prefix: str
  mqtt_interval_s: int(2,60)
