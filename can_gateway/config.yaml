name: CAN Gateway
version: "5.0.20"
slug: can_gateway
description: CAN bus gateway (SLCAN), web panel, REST API and auto-setup of can_gateway_v3 integration.
url: https://github.com/arturkmat/ha-can-gateway
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:lan-connect
panel_title: CAN Gateway
homeassistant: "2024.1.0"
discovery:
  - can_gateway_v3
hassio_api: true
homeassistant_api: true
hassio_role: default
map:
  - homeassistant_config:rw
uart: true
usb: true
devices:
  - /dev/ttyUSB0
  - /dev/ttyACM0
  - /dev/ttyACM1
options:
  connectivity:
    can_interface: slcan
    can_port: /dev/ttyACM0
    can_bitrate: 125000
    tty_baudrate: 115200
  auto_scan:
    enabled: true
    interval_s: 10
schema:
  connectivity:
    can_interface: list(slcan)
    can_port: str
    can_bitrate: list(125000|250000|500000)
    tty_baudrate: list(115200|460800)
  auto_scan:
    enabled: bool
    interval_s: int(5,120)
