name: CAN Gateway
version: "0.3.0"
slug: can_gateway
description: >-
  Konfigurator magistrali CAN (SLCAN / gs_usb) - skan, panel web, REST API
  dla Home Assistant. Wlasciciel dongla USB-CAN.
url: https://github.com/arturkmat/can-control-suite
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:lan-connect
panel_title: CAN Gateway
homeassistant: "2024.1.0"
hassio_api: true
hassio_role: default
uart: true
usb: true
devices:
  - /dev/ttyUSB0
  - /dev/ttyACM0
options:
  can_interface: slcan
  can_port: /dev/ttyACM0
  gsusb_channel: 0
  can_bitrate: 250000
  tty_baudrate: 115200
  master_key_hex: ""
  auto_scan: true
  auto_scan_interval_s: 10
  mqtt_enabled: false
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_topic_prefix: can_gateway
  mqtt_interval_s: 5
schema:
  can_interface:
    name: Typ adaptera CAN
    description: "slcan (USB serial) lub gs_usb (CANnectivity)"
    type: select
    options:
      - slcan
      - gs_usb
  can_port:
    name: Urządzenie szeregowe (SLCAN)
    description: "Np. /dev/ttyACM0 — ignorowane przy gs_usb"
    type: string
  gsusb_channel:
    name: Kanał gs_usb
    description: "CANnectivity — zwykle 0"
    type: integer
    minimum: 0
    maximum: 15
  can_bitrate:
    name: Bitrate magistrali CAN
    type: select
    options:
      - 125000
      - 250000
      - 500000
  tty_baudrate:
    name: Baudrate portu USB (SLCAN)
    type: select
    options:
      - 115200
      - 460800
  master_key_hex:
    name: MASTER_KEY (64 znaki hex)
    description: "Wymagany na szyfrowanej magistrali — 32 bajty hex bez spacji"
    type: string
  auto_scan:
    name: Auto-skan GET_SUMMARY
    description: "Co N sekund broadcast jak w konfiguratorze Windows"
    type: boolean
  auto_scan_interval_s:
    name: Interwał auto-skanu (s)
    type: integer
    minimum: 5
    maximum: 120
  mqtt_enabled:
    name: Publikuj stan przez MQTT
    description: "Opcjonalnie — topic can_gateway/state (retain)"
    type: boolean
  mqtt_host:
    name: Broker MQTT
    description: "Na HA OS zwykle core-mosquitto"
    type: string
  mqtt_port:
    name: Port MQTT
    type: integer
  mqtt_username:
    name: Użytkownik MQTT
    type: string
  mqtt_password:
    name: Hasło MQTT
    type: password
  mqtt_topic_prefix:
    name: Prefix topiców MQTT
    type: string
  mqtt_interval_s:
    name: Interwał publikacji MQTT (s)
    type: integer
    minimum: 2
    maximum: 60
